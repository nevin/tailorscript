<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Install userscript · Tailorscript</title>
  <link rel="icon" href="../icons/logo.svg">
  <link rel="stylesheet" href="install.css">
  <script type="module" src="install.js"></script>
</head>
<body>
  <header>
    <h1><img src="../icons/logo.svg" alt="" width="28" height="28">Tailorscript</h1>
  </header>
  <main>
    <p id="state" role="status">Downloading the script…</p>
    <div id="error" class="callout error" role="alert" hidden>
      <p id="error-text"></p>
      <button id="allow" type="button" hidden></button>
    </div>
    <article id="details" hidden>
      <div class="title">
        <h2 id="name"></h2>
        <span id="version" class="pill"></span>
      </div>
      <p id="description"></p>
      <p id="byline" class="muted"></p>
      <div id="existing" class="callout" hidden></div>
      <dl>
        <dt>Runs on</dt>
        <dd id="sites"></dd>
        <dt>Can</dt>
        <dd><ul id="grants"></ul></dd>
        <dt id="code-title" hidden>Also loads</dt>
        <dd id="code-sources" hidden><ul></ul></dd>
      </dl>
      <p id="insecure" class="callout warning" hidden></p>
      <p id="unsupported" class="callout warning" hidden></p>
      <div class="options">
        <label><input type="checkbox" id="enable"> Turn it on after installing</label>
        <label><input type="checkbox" id="auto-update" checked> Keep it updated automatically</label>
      </div>
      <div class="actions">
        <button id="install" type="button" class="primary">Install</button>
        <button id="cancel" type="button">Cancel</button>
      </div>
      <details id="code">
        <summary>View code</summary>
        <div id="changes" hidden></div>
        <pre id="source"></pre>
      </details>
    </article>
    <div id="done" class="callout success" hidden>
      <p id="done-text"></p>
      <div class="actions">
        <button id="open-manager" type="button" class="primary">Open in manager</button>
        <button id="close" type="button">Close tab</button>
      </div>
    </div>
  </main>
</body>
</html>
