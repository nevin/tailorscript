<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Tailorscript</title>
  <link rel="icon" href="../icons/logo.svg">
  <link rel="stylesheet" href="popup.css">
  <script type="module" src="popup.js"></script>
</head>
<body>
  <header>
    <h1><img src="../icons/logo.svg" alt="" width="22" height="22">Tailorscript</h1>
    <label class="switch-label"><input type="checkbox" role="switch" class="switch" id="paused"> Pause all</label>
  </header>
  <section class="site" aria-labelledby="page">
    <div>
      <h2 id="page"></h2>
      <p id="count"></p>
    </div>
    <button id="reload" type="button">Reload</button>
  </section>
  <p id="notice" role="status"></p>
  <ul id="scripts"></ul>
  <div id="empty" hidden>
    <p id="empty-text"></p>
  </div>
  <footer>
    <button id="create" type="button" class="primary">+ New script for this site</button>
    <div class="links">
      <button id="check" type="button" class="link">Check this page</button>
      <button id="manager" type="button" class="link">Open manager</button>
    </div>
  </footer>
</body>
</html>
