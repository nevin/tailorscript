<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Tailorscript</title>
  <link rel="icon" href="../icons/logo.svg">
  <link rel="stylesheet" href="popup.css">
  <script type="module" src="popup.js"></script>
</head>
<body>
  <header>
    <div>
      <h1><img src="../icons/logo.svg" alt="" width="20" height="20">Tailorscript</h1>
      <p id="page"></p>

    <label class="toggle"><input type="checkbox" id="paused"> Pause all</label>

    <button id="reload" type="button">Reload tab</button>

    <button id="manager" type="button">Open manager</button>
  </footer>
</body>
</html>
